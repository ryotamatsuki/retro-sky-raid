<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Retro Sky Raid</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="shell">
      <section class="game-frame" aria-label="Retro vertical shooter game">
        <canvas id="game" width="320" height="480"></canvas>
        <section class="touch-controls" data-controls="mobile" aria-label="Mobile action controls">
          <button
            class="touch-button touch-button--bomb touch-button--primary"
            type="button"
            data-action="bomb"
            data-action-priority="primary"
            data-action-role="emergency"
            data-action-state="remaining"
            aria-label="Use bomb (1 remaining)"
            aria-describedby="mobile-guide-danger"
          >
            <span class="touch-button__label" data-action-label data-action-count="remaining" aria-live="polite" aria-atomic="true">BOMB 1</span>
            <small class="touch-button__hint">EMERGENCY</small>
          </button>
          <button
            class="touch-button touch-button--pause touch-button--secondary"
            type="button"
            data-action="pause"
            data-action-priority="secondary"
            data-action-role="utility"
            data-action-state="toggle"
            aria-label="Pause or resume game"
            aria-describedby="mobile-guide-pause"
          >
            <span class="touch-button__label" data-action-label aria-live="polite" aria-atomic="true">PAUSE</span>
            <small class="touch-button__hint">UTILITY</small>
          </button>
          <button
            class="touch-button touch-button--mute touch-button--secondary"
            type="button"
            data-action="mute"
            data-action-priority="secondary"
            data-action-role="utility"
            data-action-state="toggle"
            aria-label="Toggle sound"
            aria-describedby="mobile-guide-mute"
          >
            <span class="touch-button__label" data-action-label aria-live="polite" aria-atomic="true">MUTE</span>
            <small class="touch-button__hint">UTILITY</small>
          </button>
        </section>
        <aside class="mobile-guide" data-guide="mobile-controls" aria-label="Mobile controls guide">
          <p class="mobile-guide__title">MOBILE PLAY GUIDE</p>
          <ul class="mobile-guide__list">
            <li id="mobile-guide-move" data-guide-item="move">DRAG ANYWHERE TO MOVE</li>
            <li id="mobile-guide-fire" data-guide-item="fire">AUTO FIRE</li>
            <li id="mobile-guide-danger" data-guide-item="bomb">BOMB WHEN IN DANGER</li>
            <li id="mobile-guide-pause" data-guide-item="pause">PAUSE TO TAKE A BREAK</li>
            <li id="mobile-guide-mute" data-guide-item="mute">MUTE FOR SILENT PLAY</li>
          </ul>
        </aside>
      </section>
      <aside class="side-panel" aria-label="Game status">
        <div class="panel-title">RETRO SKY RAID</div>
        <div class="stat-row"><span>MOVE</span><b>ARROWS / WASD</b></div>
        <div class="stat-row"><span>SHOT</span><b>SPACE / Z</b></div>
        <div class="stat-row"><span>BOMB</span><b>X</b></div>
        <div class="stat-row"><span>PAUSE</span><b>P / ENTER</b></div>
        <div class="stat-row"><span>MUTE</span><b>M</b></div>
        <div class="tiny">HTML5 Canvas / 320x480 pixel arcade build</div>
      </aside>
    </main>
    <script src="game.js"></script>
  </body>
</html>
