<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Retro Sky Raid</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="shell">
      <section class="game-frame" aria-label="Retro vertical shooter game">
        <canvas id="game" width="320" height="480"></canvas>
        <div class="touch-controls" aria-label="Touch controls">
          <button class="touch-button touch-button--bomb" type="button" data-action="bomb" aria-label="Use bomb">
            <span data-action-label>BOMB</span>
          </button>
          <button class="touch-button touch-button--pause" type="button" data-action="pause" aria-label="Pause or resume game">
            <span data-action-label>PAUSE</span>
          </button>
          <button class="touch-button touch-button--mute" type="button" data-action="mute" aria-label="Toggle sound">
            <span data-action-label>MUTE</span>
          </button>
        </div>
      </section>
      <aside class="side-panel" aria-label="Game status">
        <div class="panel-title">RETRO SKY RAID</div>
        <div class="stat-row"><span>MOVE</span><b>ARROWS / WASD</b></div>
        <div class="stat-row"><span>SHOT</span><b>SPACE / Z</b></div>
        <div class="stat-row"><span>BOMB</span><b>X</b></div>
        <div class="stat-row"><span>PAUSE</span><b>P / ENTER</b></div>
        <div class="stat-row"><span>MUTE</span><b>M</b></div>
        <div class="tiny">HTML5 Canvas / 320x480 pixel arcade build</div>
      </aside>
    </main>
    <script src="game.js"></script>
  </body>
</html>
